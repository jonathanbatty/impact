[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impact"
version = "0.1.0"
authors = [
  { name="Jonathan A. Batty", email="J.Batty@leeds.ac.uk" },
]
description = "A package to implement the Inclusive Multimorbidity Phenotyping Algorithm (IMPACT)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pandas"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/jonathanbatty/impact"
Issues = "https://github.com/jonathanbatty/impact/issues"