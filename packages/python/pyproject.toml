[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impact"
version = "1.0"
authors = [
  { name="Jonathan A. Batty", email="J.Batty@leeds.ac.uk" },
]
description = "The Inclusive Multimorbidity Phenotyping Algorithm and Coding Tool (IMPACT)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pandas"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/jonathanbatty/impact"
Issues = "https://github.com/jonathanbatty/impact/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impact = ["data/*.json", "data/*.json.gz"]
