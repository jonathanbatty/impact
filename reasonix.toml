allow = ["Bash=git remote -v 2>/dev/null; echo \"---branch---\"; git branch --show-current 2>/dev/null; echo \"---status---\"; git status --short 2>/dev/null | head -20", "Bash=cd packages/python && PYTHONPATH=src python -c \"\nfrom impact import impact\nm = impact.select_codesystem('icd9cm')\nprint('select_codesystem ok, icd9cm keys:', len(m))\nprint('41001 ->', m.get('41001'))\n\"", "Bash=cd packages/python && PYTHONPATH=src python -c \"from impact import impact; print(len(impact.select_codesystem('icd9cm')))\"", "Bash=cd codelists && for d in */; do echo \"== $d\"; ls \"$d\" | sed 's/\\.txt$//' | tr '\\n' ' '; echo; done"]
